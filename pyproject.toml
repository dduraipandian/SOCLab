[project]
name = "soc-lab"
version = "0.1.0"
description = "SOC lab: fake vendor APIs (EDR, IdP, cloud), hosts with sensors, and attack scenarios that generate alerts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "psycopg[binary,pool]>=3.2",
    "docker>=7.1",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the Docker Compose stack"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py312"
